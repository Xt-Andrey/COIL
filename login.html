<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - AeroAndes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="contenedor-login">
        <div class="tarjeta-login">

            <h1 class="titulo">Inicio de Sesion - AeroAndes</h1>
            <p class="subtitulo">Inicia sesion para comenzar tu sesion</p>

            <form id="form-login" action="#" method="post">

                <div class="grupo-campo">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" placeholder="Correo electronico" required>
                </div>

                <div class="grupo-campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>

                <div class="fila-opciones">
                    <label>
                        <input type="checkbox" id="recordarme" name="recordarme">
                        Recordarme
                    </label>
                    <button type="submit" class="boton-principal">Iniciar sesion</button>
                </div>

            </form>

            <div class="enlaces">
                <a href="recuperar.html">Olvide mi contraseña</a>
                <a href="registro.html">Registrar una nueva cuenta</a>
            </div>

        </div>
    </div>

</body>
</html>

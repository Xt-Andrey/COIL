<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - AeroAndes</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js"></script>
</head>
<body>

    <div class="contenedor-login">
        <div class="tarjeta-login">

            <h1 class="titulo">Recuperar contraseña</h1>
            <p class="subtitulo">Estas a un paso de tu nueva contraseña. Recuperala ahora.</p>

            <form id="form-recuperar" action="#" method="post">

                <div class="grupo-campo">
                    <label for="password">Nueva contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>

                <div class="grupo-campo">
                    <label for="confirmar-password">Confirmar contraseña</label>
                    <input type="password" id="confirmar-password" name="confirmar-password" placeholder="Confirmar contraseña" required>
                </div>

                <button type="submit" class="boton-principal boton-ancho">Cambiar contraseña</button>

            </form>

            <div class="enlaces">
                <a href="login.html">Iniciar sesion</a>
            </div>

        </div>
    </div>

</body>
</html>
